<script>
var DATA_HOJE = '2026-08-07';

document.querySelectorAll('.mc-event-chip').forEach(function (botao) {
    botao.addEventListener('click', function () {
        abrirModalEvento(JSON.parse(this.getAttribute('data-evento')));
    });
});

function abrirModalEvento(evento) {
    var titulo = evento.nome || 'Evento';
    var isAniversario = evento.tipo_item === 'aniversario';
    var foto = isAniversario
        ? (evento.foto_membro ? 'uploads/membros/' + evento.foto_membro : '')
        : (evento.foto_evento ? 'uploads/eventos/' + evento.foto_evento : '');
    var body = '';
    var footer = '';
    var modal = document.getElementById('modalEvento');

    document.getElementById('modalTitulo').innerText = titulo;
    modal.classList.toggle('is-birthday-modal', isAniversario);
    modal.classList.toggle('is-event-detail-modal', !isAniversario);

    if (isAniversario) {
        var nomeMembro = evento.nome_membro || 'Aniversariante';
        var apelido = evento.apelido || '';
        var base = evento.base_responsavel || '';
        var fotoHtml = foto
            ? '<img src="' + escapeHtml(foto) + '" class="mc-birthday-modal-photo" alt="">'
            : '<div class="mc-birthday-modal-photo is-empty"><i class="fa fa-birthday-cake"></i></div>';

        body += '<section class="mc-birthday-modal-card">';
        body += '  <div class="mc-birthday-modal-main">';
        body +=        fotoHtml;
        body += '    <div class="mc-birthday-modal-text">';
        body += '      <span>Aniversariante do mes</span>';
        body += '      <h3>' + escapeHtml(apelido || nomeMembro) + '</h3>';
        if (apelido && apelido !== nomeMembro) {
            body += '      <p>' + escapeHtml(nomeMembro) + '</p>';
        }
        body += '    </div>';
        body += '  </div>';
        body += '  <div class="mc-birthday-modal-details">';
        body +=        linhaInfo('Data', formatarData(evento.data_evento || ''));
        if (base) {
            body +=    linhaInfo('Base', base);
        }
        body += '  </div>';
        body += '</section>';

        document.getElementById('modalBody').innerHTML = body;
        footer += '<a class="btn btn-success" href="cartao_aniversario.php?id_membro=' + encodeURIComponent(evento.id_membro || '') + '"><i class="fa fa-picture-o"></i> Gerar cartao</a>';
        footer += '<button type="button" class="btn btn-default" data-dismiss="modal">Fechar</button>';
        document.getElementById('modalFooter').innerHTML = footer;
        $('#modalEvento').modal('show');
        return;
    }

    body += '<section class="mc-event-detail">';
    body += '  <div class="mc-event-detail-media">';
    if (foto) {
        body += '    <img src="' + escapeHtml(foto) + '" class="mc-modal-photo" alt="' + escapeHtml(titulo) + '">';
    } else {
        body += '    <div class="mc-modal-empty"><i class="fa fa-calendar-check-o"></i><span>Evento sem foto cadastrada</span></div>';
    }
    body += '  </div>';
    body += '  <div class="mc-event-detail-info">';

    body += '    <div class="mc-event-highlight">';
    body += '      <div class="mc-event-highlight-item"><i class="fa fa-calendar"></i><div><small>Data</small><strong>' + escapeHtml(formatarData(evento.data_evento || '')) + '</strong></div></div>';
    if (evento.hora_evento) {
        body += '      <div class="mc-event-highlight-item"><i class="fa fa-clock-o"></i><div><small>Horario</small><strong>' + escapeHtml(evento.hora_evento.substring(0, 5)) + '</strong></div></div>';
    }
    if (evento.local_evento) {
        body += '      <div class="mc-event-highlight-item is-location"><i class="fa fa-map-marker"></i><div><small>Local</small><strong>' + escapeHtml(evento.local_evento) + '</strong></div></div>';
    }
    body += '    </div>';

    body += '    <div class="mc-event-metadata">';

    body += linhaInfo('Tipo', evento.tipo_evento || '');
    body += linhaInfo('Base', evento.base_responsavel || '');

    body += '<div class="mc-info-line"><strong>Status</strong><span class="label ' + classeStatus(evento.status) + '">' + escapeHtml(evento.status || '') + '</span></div>';

    body += '    </div>';

    if (evento.descricao) {
        body += '    <div class="mc-event-description"><strong>Sobre o evento</strong><p>' + escapeHtml(evento.descricao) + '</p></div>';
    }

    body += '  </div>';
    body += '</section>';

    document.getElementById('modalBody').innerHTML = body;

    if (evento.link_instagram) {
        footer += '<a href="' + escapeHtml(evento.link_instagram) + '" target="_blank" class="btn btn-primary"><i class="fa fa-instagram"></i> Divulgacao</a>';
    }

    if (evento.link_google_drive) {
        var idDrive = extrairIdDrive(evento.link_google_drive);
        footer += '<a href="galeria_drive_mosaico.php?id=' + encodeURIComponent(idDrive) + '&titulo=' + encodeURIComponent(titulo) + '" class="btn btn-info"><i class="fa fa-folder-open"></i> Album</a>';
    }

    if (evento.link_youtube) {
        footer += '<a href="' + escapeHtml(evento.link_youtube) + '" target="_blank" class="btn btn-danger"><i class="fa fa-youtube-play"></i> YouTube</a>';
    }

    if (evento.data_evento === DATA_HOJE) {
        footer += '<a href="checkin_evento.php?id_evento=' + encodeURIComponent(evento.id_evento) + '" class="btn btn-success"><i class="fa fa-check"></i> Check-in</a>';
    }

    footer += '<button type="button" class="btn btn-default" data-dismiss="modal">Fechar</button>';
    document.getElementById('modalFooter').innerHTML = footer;

    $('#modalEvento').modal('show');
}

function linhaInfo(label, valor) {
    return '<div class="mc-info-line"><strong>' + escapeHtml(label) + '</strong><span>' + escapeHtml(valor) + '</span></div>';
}

function classeStatus(status) {
    if (status === 'Aberto') return 'label-success';
    if (status === 'Finalizado') return 'label-default';
    if (status === 'Pendente') return 'label-warning';
    return 'label-info';
}

function formatarData(data) {
    var partes = String(data).split('-');
    if (partes.length !== 3) return data;
    return partes[2] + '/' + partes[1] + '/' + partes[0];
}

function extrairIdDrive(link) {
    if (!link) return '';
    var match = link.match(/\/folders\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    match = link.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    if (/^[a-zA-Z0-9_-]{10,}$/.test(link)) return link;
    return '';
}

function escapeHtml(texto) {
    return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}
